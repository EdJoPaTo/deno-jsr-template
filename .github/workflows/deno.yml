name: Deno

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Check if it works with current deno version
    - cron: "42 2 * * 6" # weekly on Saturday 2:42 UTC

jobs:
  denofmt-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@v7

      - run: deno lint
      - run: deno fmt --check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@v7

      - run: deno cache ./**/*.ts
      - run: deno check ./**/*.ts

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@v7

      - run: deno cache ./**/*.ts
      - run: deno doc --lint source/mod.ts

  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@v7

      - run: deno cache ./**/*.ts
      - run: deno publish --dry-run

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@v7

      - run: deno cache ./**/*.ts
      - run: deno test --no-check --coverage --doc
